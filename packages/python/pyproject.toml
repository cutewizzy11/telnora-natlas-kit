[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telnora-natlas"
version = "0.1.0"
description = "Python client for N-ATLAS: chat, streaming and speech-to-text. No dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"

[tool.setuptools]
packages = ["natlas"]
